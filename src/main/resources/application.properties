# ----------------------------------------------------
# CONFIGURAO GERAL DO BFF SERVICE
# ----------------------------------------------------
spring.application.name=connect-rh-bff
# O BFF Service roda na porta 8081
server.port=8081
# ----------------------------------------------------
# 1. CONFIGURAO DO JWT (JSON Web Token)
# ----------------------------------------------------
# Chave secreta usada para assinar e verificar os tokens JWT.
# DEVE ser uma string longa e complexa.
connectrh.jwt.secret=aW5jcmVkaXZlbWVudGUtbG9uZy1zZWNyZXQta2V5LWZvci1jb25uZWN0LXJoLWJmZg==
# Tempo de expira��o do token (em milissegundos) - 1 hora
connectrh.jwt.expiration=3600000
# ----------------------------------------------------
# 2. COMUNICAO COM O CORE SERVICE (CLIENTE HTTP)
# ----------------------------------------------------
# URL BASE para o Core Service.
# LOCALMENTE, o host 'localhost' (onde o Core est rodando na porta 8080).
connectrh.core.url=http://localhost:8080
# Chave secreta que o BFF envia no Header 'X-Internal-Api-Key' ao Core.
# DEVE SER IDNTICA  chave definida no Core Service (CHAVE_SECRETA_BFF_TO_CORE_12345).
connectrh.security.internal-api-key=CHAVE_SECRETA_BFF_TO_CORE_12345
# ----------------------------------------------------
# 3. SPRING SECURITY (Necessrio para a configurao JWT)
# ----------------------------------------------------
# Isso  um fallback, a configurao real est em @Configuration
spring.security.user.name=user
spring.security.user.password=password
# Codificao UTF-8
spring.mandatory-file-encoding=UTF-8

